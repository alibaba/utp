<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UTP 交易上下文级与交易级状态迁移图">
  <defs>
    <marker id="gsm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="gsm-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="20" y="10" width="1140" height="58" rx="6" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="48" y="44" font-size="12" font-weight="600" fill="#1a1a2e">图例：</text>
  <line x1="120" y1="39" x2="168" y2="39" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <text x="182" y="44" font-size="11" fill="#6b7280">正向迁移</text>
  <line x1="330" y1="39" x2="378" y2="39" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#gsm-arrow)"/>
  <text x="382" y="44" font-size="11" fill="#6b7280">条件跳跃 / 循环</text>
  <line x1="570" y1="39" x2="618" y2="39" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#gsm-arrow-gray)"/>
  <text x="632" y="44" font-size="11" fill="#6b7280">异常 / 横切迁移</text>
  <rect x="830" y="27" width="48" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="892" y="44" font-size="11" fill="#6b7280">活跃状态</text>
  <rect x="1010" y="27" width="48" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1072" y="44" font-size="11" fill="#6b7280">终态</text>

  <text x="285" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">交易上下文级 · trade_context_id</text>
  <text x="850" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">交易级 · transaction_id</text>
  <line x1="560" y1="84" x2="560" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,6"/>

  <rect x="20" y="150" width="125" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">INIT</text>
  <rect x="185" y="150" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">SOURCING</text>
  <rect x="375" y="150" width="145" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="447" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">NEGOTIATING</text>

  <rect x="620" y="150" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="710" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">PURCHASING</text>
  <rect x="620" y="310" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="347" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">PAYING</text>
  <rect x="840" y="310" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="925" y="347" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">FULFILLING</text>
  <rect x="1045" y="310" width="115" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1102" y="347" text-anchor="middle" font-size="15" font-weight="600" fill="#166534">SETTLED</text>

  <line x1="145" y1="180" x2="183" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <text x="164" y="137" text-anchor="middle" font-size="10" fill="#6b7280">search / lookup</text>
  <line x1="335" y1="180" x2="373" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <text x="354" y="137" text-anchor="middle" font-size="9.5" fill="#6b7280">pricing≥L1 或 decision≥L1</text>
  <line x1="520" y1="180" x2="618" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <rect x="500" y="119" width="140" height="24" rx="4" fill="#ffffff"/>
  <text x="570" y="137" text-anchor="middle" font-size="10" fill="#6b7280">purchase.complete · 1..N</text>

  <path d="M 260 210 C 260 275, 545 275, 620 196" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#gsm-arrow)"/>
  <rect x="185" y="246" width="360" height="24" rx="4" fill="#ffffff"/>
  <text x="365" y="263" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">purchase.complete · pricing=L0（确认 1..N 笔交易）</text>

  <line x1="710" y1="210" x2="710" y2="308" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <line x1="780" y1="340" x2="838" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>
  <line x1="1010" y1="340" x2="1043" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#gsm-arrow)"/>

  <path d="M 925 370 C 925 420, 700 420, 700 372" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#gsm-arrow)"/>
  <rect x="700" y="397" width="225" height="24" rx="4" fill="#ffffff"/>
  <text x="812" y="414" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">payment≥L1（下一期付款）</text>

  <text x="60" y="454" font-size="11" fill="#92400e">任何交易级非终态均可进入 DISPUTED</text>
  <rect x="60" y="470" width="1100" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="610" y="505" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">DISPUTED（P6 Resolve 横切状态，可从任何交易级非终态进入）</text>
  <text x="870" y="558" text-anchor="middle" font-size="11" fill="#92400e">争议解决后：恢复原状态 / FAILED / CANCELLED</text>

  <rect x="210" y="590" width="150" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="285" y="625" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">FAILED</text>
  <rect x="455" y="590" width="170" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="540" y="625" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">CANCELLED</text>
  <path d="M 330 528 L 285 588" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#gsm-arrow-gray)"/>
  <path d="M 500 528 L 540 588" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#gsm-arrow-gray)"/>
  <text x="255" y="568" text-anchor="middle" font-size="11" fill="#92400e">补偿链完毕</text>
  <text x="570" y="568" text-anchor="middle" font-size="11" fill="#92400e">超时 / 主动取消</text>
</svg>
