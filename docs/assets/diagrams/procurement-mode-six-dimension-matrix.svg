<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; }
    .cell { font-size: 13.5px; font-weight: 750; fill: #111827; }
    .celldim { font-size: 9.5px; font-weight: 600; fill: #6b7280; }
    .dim { font-size: 14.5px; font-weight: 800; fill: #111827; }
    .dimcode { font-size: 10px; font-weight: 600; fill: #9ca3af; }
    .lvl { font-size: 15px; font-weight: 800; }
    .lvlsub { font-size: 9.5px; font-weight: 600; fill: #6b7280; }
    .title { font-size: 20px; font-weight: 800; fill: #111827; }
    .subtitle { font-size: 10.5px; font-weight: 500; fill: #6b7280; }
    .legend { font-size: 9.5px; font-weight: 500; fill: #374151; }
    .legend-h { font-size: 10px; font-weight: 700; fill: #111827; }
    .axis { font-size: 11.5px; font-weight: 800; }
  </style>
  <defs>
    <linearGradient id="axgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" class="title">UTP 采购模式六维配置矩阵</text>
  <text x="30" y="60" class="subtitle">Procurement Mode · 六个维度分别取值 · 共同确定本次交易的原语行为、交互步骤和约束条件</text>

  <!-- Complexity gradient axis -->
  <polygon points="330 85, 1198 85, 1198 77, 1234 88, 1198 99, 1198 91, 330 91" fill="url(#axgrad)"/>
  <text x="330" y="76" class="axis" fill="#2563eb">简单端</text>
  <text x="1228" y="72" class="axis" fill="#1e40af" text-anchor="end">复杂端 · 复杂度递增</text>

  <!-- Level column headers -->
  <text x="440" y="112" class="lvl" fill="#60a5fa" text-anchor="middle">L0</text>
  <text x="440" y="124" class="lvlsub" text-anchor="middle">基础流程</text>
  <text x="660" y="112" class="lvl" fill="#3b82f6" text-anchor="middle">L1</text>
  <text x="880" y="112" class="lvl" fill="#2563eb" text-anchor="middle">L2</text>
  <text x="1120" y="112" class="lvl" fill="#1e40af" text-anchor="middle">L3</text>
  <text x="1120" y="124" class="lvlsub" text-anchor="middle">扩展流程</text>

  <!-- Row 1: pricing_mode -->
  <rect x="40" y="140" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="172" class="dim">价格模式</text>
  <text x="56" y="190" class="dimcode">pricing_mode</text>
  <rect x="330" y="140" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="176" class="cell" text-anchor="middle">固定价</text>
  <text x="430" y="192" class="celldim" text-anchor="middle">商品标识确定</text>
  <rect x="550" y="140" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="176" class="cell" text-anchor="middle">阶梯价</text>
  <text x="650" y="192" class="celldim" text-anchor="middle">商品 + 数量</text>
  <rect x="770" y="140" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="176" class="cell" text-anchor="middle">规则计价</text>
  <text x="870" y="192" class="celldim" text-anchor="middle">结构化选项 + 计价规则</text>
  <rect x="990" y="140" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="176" class="cell" text-anchor="middle">询报价</text>
  <text x="1115" y="192" class="celldim" text-anchor="middle">供应商生成有效报价</text>

  <!-- Row 2: decision_path -->
  <rect x="40" y="218" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="250" class="dim">决策链路</text>
  <text x="56" y="268" class="dimcode">decision_path</text>
  <rect x="330" y="218" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="258" class="cell" text-anchor="middle">直接采纳</text>
  <rect x="550" y="218" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="258" class="cell" text-anchor="middle">改价审批</text>
  <rect x="770" y="218" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="258" class="cell" text-anchor="middle">双方议价</text>
  <rect x="990" y="218" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="258" class="cell" text-anchor="middle">多方竞价</text>

  <!-- Row 3: payment_structure -->
  <rect x="40" y="296" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="328" class="dim">付款结构</text>
  <text x="56" y="346" class="dimcode">payment_structure</text>
  <rect x="330" y="296" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="336" class="cell" text-anchor="middle">即时全额</text>
  <rect x="550" y="296" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="336" class="cell" text-anchor="middle">分阶段付款</text>
  <rect x="770" y="296" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="336" class="cell" text-anchor="middle">账期付款</text>
  <rect x="990" y="296" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="336" class="cell" text-anchor="middle">信用证</text>

  <!-- Row 4: fulfillment_structure -->
  <rect x="40" y="374" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="406" class="dim">履约结构</text>
  <text x="56" y="424" class="dimcode">fulfillment_structure</text>
  <rect x="330" y="374" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="414" class="cell" text-anchor="middle">直接履约</text>
  <rect x="550" y="374" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="414" class="cell" text-anchor="middle">标准委托履约</text>
  <rect x="770" y="374" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="414" class="cell" text-anchor="middle">分阶段履约</text>
  <rect x="990" y="374" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="414" class="cell" text-anchor="middle">跨境/复杂履约</text>

  <!-- Row 5: relationship_mode -->
  <rect x="40" y="452" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="484" class="dim">关系模式</text>
  <text x="56" y="502" class="dimcode">relationship_mode</text>
  <rect x="330" y="452" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="492" class="cell" text-anchor="middle">一次性交易</text>
  <rect x="550" y="452" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="492" class="cell" text-anchor="middle">复购合约</text>
  <rect x="770" y="452" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="492" class="cell" text-anchor="middle">框架协议</text>
  <rect x="990" y="452" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="492" class="cell" text-anchor="middle">战略合作</text>

  <!-- Row 6: compliance_level -->
  <rect x="40" y="530" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="562" class="dim">合规要求</text>
  <text x="56" y="580" class="dimcode">compliance_level</text>
  <rect x="330" y="530" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="570" class="cell" text-anchor="middle">无附加要求</text>
  <rect x="550" y="530" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="650" y="570" class="cell" text-anchor="middle">资质核验</text>
  <rect x="770" y="530" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="870" y="570" class="cell" text-anchor="middle">跨境清关合规校验</text>
  <rect x="990" y="530" width="250" height="70" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/>
  <text x="1115" y="570" class="cell" text-anchor="middle">全面审计</text>

  <!-- Example combinations -->
  <text x="40" y="644" class="legend-h">配置示例（不作为 B2C / B2B 的类型约束）</text>
  <rect x="40" y="654" width="1200" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="675" class="legend" fill="#1e40af">标准 B2C 零售示例：固定价 · 直接采纳 · 即时全额 · 直接履约 · 一次性交易 · 无附加要求</text>
  <rect x="40" y="694" width="1200" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="56" y="715" class="legend" fill="#1e3a5f">复杂 B2B 示例：询报价 · 多方竞价 · 信用证 · 跨境履约 · 战略合作 · 全面审计</text>

  <!-- Right note -->
  <text x="40" y="756" class="legend" fill="#9ca3af">六个维度分别取值，不要求处于同一 Level；同一 B2C 或 B2B 场景可因支付、履约和合规要求采用不同组合。</text>
</svg>
