<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="330px" viewBox="-0.5 -0.5 760 330" font-family="Helvetica">
<defs>
<marker id="mQuoArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mQuoArrowR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/></marker>
<marker id="mQuoArrowB" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6c8ebf"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">M5.2.1 询盘应答任务状态机（utp.quote）</text>

<!-- INQUIRY_PENDING -->
<rect x="40" y="60" width="170" height="46" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="125" y="80" text-anchor="middle" font-size="12" font-weight="bold">INQUIRY_PENDING</text>
<text x="125" y="97" text-anchor="middle" font-size="9.5">待应答（询盘路由送达）</text>

<!-- QUOTED -->
<rect x="330" y="60" width="170" height="46" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="415" y="80" text-anchor="middle" font-size="12" font-weight="bold">QUOTED</text>
<text x="415" y="97" text-anchor="middle" font-size="9.5">已报价（买方决策窗口）</text>

<!-- BUYER_COUNTERED -->
<rect x="330" y="160" width="170" height="46" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="415" y="180" text-anchor="middle" font-size="12" font-weight="bold">BUYER_COUNTERED</text>
<text x="415" y="197" text-anchor="middle" font-size="9.5">买方还价（round_no 递增）</text>

<!-- BOUND -->
<rect x="590" y="60" width="140" height="46" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="660" y="80" text-anchor="middle" font-size="12" font-weight="bold">BOUND（终）</text>
<text x="660" y="97" text-anchor="middle" font-size="9.5">条款绑定 → P3</text>

<!-- DECLINED -->
<rect x="40" y="230" width="170" height="46" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="125" y="250" text-anchor="middle" font-size="12" font-weight="bold">DECLINED（终）</text>
<text x="125" y="267" text-anchor="middle" font-size="9.5">谢绝 / 超时 auto_decline / 轮次超限</text>

<!-- EXPIRED -->
<rect x="590" y="160" width="140" height="46" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="660" y="180" text-anchor="middle" font-size="12" font-weight="bold">EXPIRED（终）</text>
<text x="660" y="197" text-anchor="middle" font-size="9.5">valid_until 到期 / 询盘撤回</text>

<!-- transitions -->
<path d="M 210 76 L 326 76" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mQuoArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="212" y="58" width="112" height="14" fill="#fff"/><text x="268" y="69">quote / bid（签名验证）</text></g>

<path d="M 500 76 L 586 76" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mQuoArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="496" y="58" width="96" height="14" fill="#fff"/><text x="544" y="69">买方接受（时效内）</text></g>

<path d="M 440 106 L 440 156" fill="none" stroke="#6c8ebf" marker-end="url(#mQuoArrowB)"/>
<g font-size="9.5" text-anchor="middle" fill="#6c8ebf"><rect x="446" y="124" width="76" height="14" fill="#fff"/><text x="484" y="135">买方还价（事件）</text></g>
<path d="M 390 156 L 390 106" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mQuoArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="304" y="124" width="82" height="14" fill="#fff"/><text x="345" y="135">quote（新一轮）</text></g>

<path d="M 415 106 L 415 106" fill="none" stroke="rgb(0,0,0)" opacity="0"/>
<path d="M 460 60 Q 480 30 445 46 Q 430 52 442 58" fill="none" stroke="rgb(0,0,0)" opacity="0"/>
<g font-size="9.5" text-anchor="middle"><rect x="352" y="34" width="126" height="14" fill="#fff"/><text x="415" y="45">revise（新版本，停留 QUOTED）</text></g>
<path d="M 380 60 Q 380 40 415 40 Q 450 40 450 56" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mQuoArrow)"/>

<path d="M 500 190 L 586 190" fill="none" stroke="rgb(0,0,0)" opacity="0"/>
<path d="M 500 96 Q 560 130 588 162" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mQuoArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="506" y="118" width="96" height="14" fill="#fff"/><text x="554" y="129">valid_until 到期</text></g>

<path d="M 125 106 L 125 226" fill="none" stroke="#b85450" marker-end="url(#mQuoArrowR)"/>
<g font-size="9.5" text-anchor="middle" fill="#b85450"><rect x="130" y="158" width="130" height="14" fill="#fff"/><text x="195" y="169">decline / deadline 超时</text></g>
<path d="M 330 196 Q 240 210 214 236" fill="none" stroke="#b85450" marker-end="url(#mQuoArrowR)"/>
<g font-size="9.5" text-anchor="middle" fill="#b85450"><rect x="226" y="204" width="96" height="14" fill="#fff"/><text x="274" y="215">decline / 轮次超限</text></g>

<!-- constraint band -->
<rect x="300" y="240" width="430" height="72" rx="6" fill="none" stroke="#b85450" stroke-dasharray="4 3"/>
<text x="515" y="260" text-anchor="middle" font-size="10" fill="#b85450">终态后写操作 MUST 返回 QUOTE.STATE_CONFLICT（幂等重放除外）</text>
<text x="515" y="277" text-anchor="middle" font-size="10" fill="#b85450">quote 签名 MUST 覆盖 quote_hash（JCS，M1.10）· 同一 inquiry 在途有效报价至多一份</text>
<text x="515" y="294" text-anchor="middle" font-size="10" fill="#b85450">BOUND 后 MP4 accept MUST NOT 偏离已绑定条款（quote_hash → terms_hash 价格证据链）</text>
</g>
</svg>
