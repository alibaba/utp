<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Pay 原语状态机</title>
  <desc id="desc">支付从 INIT 经授权和渠道处理进入确认、部分完成或全部完成；失败补偿及完成退款进入 COMPENSATED，处理中退款不迁移状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <style>
      .state { rx: 10; stroke-width: 2; }
      .normal { fill: #eef4ff; stroke: #4e73df; }
      .active { fill: #fff7df; stroke: #d69e2e; }
      .success { fill: #e8f7ed; stroke: #3a9d5d; }
      .failure { fill: #fdecec; stroke: #c94b4b; }
      .line { fill: none; stroke: #344054; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; text-anchor: middle; }
      .edge { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; text-anchor: middle; }
      .note { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
    </style>
  </defs>

  <rect class="state normal" x="40" y="70" width="130" height="52"/>
  <text class="label" x="105" y="101">INIT</text>
  <rect class="state active" x="235" y="70" width="140" height="52"/>
  <text class="label" x="305" y="101">AUTHORIZED</text>
  <rect class="state active" x="440" y="70" width="140" height="52"/>
  <text class="label" x="510" y="101">PROCESSING</text>
  <rect class="state success" x="645" y="70" width="140" height="52"/>
  <text class="label" x="715" y="101">CONFIRMED</text>
  <rect class="state success" x="825" y="70" width="140" height="52"/>
  <text class="label" x="895" y="101">COMPLETED</text>
  <rect class="state active" x="645" y="245" width="140" height="52"/>
  <text class="label" x="715" y="276">PARTIAL</text>
  <rect class="state failure" x="440" y="245" width="140" height="52"/>
  <text class="label" x="510" y="276">FAILED</text>
  <rect class="state success" x="440" y="420" width="150" height="52"/>
  <text class="label" x="515" y="451">COMPENSATED</text>

  <path class="line" d="M170 96 H235"/>
  <text class="edge" x="202" y="84">pay.initiate</text>
  <path class="line" d="M375 96 H440"/>
  <text class="edge" x="407" y="83">confirm / term</text>
  <path class="line" d="M580 96 H645"/>
  <text class="edge" x="612" y="83">PAYMENT_CAPTURED</text>
  <path class="line" d="M785 96 H825"/>
  <text class="edge" x="805" y="83">全部阶段完成</text>
  <path class="line" d="M715 122 V245"/>
  <text class="edge" x="790" y="187">仍有后续付款阶段</text>
  <path class="line" d="M645 271 C610 271 610 155 510 128"/>
  <text class="edge" x="577" y="226">pay.term</text>
  <path class="line" d="M510 122 V245"/>
  <text class="edge" x="570" y="187">PAYMENT_FAILED</text>
  <path class="line" d="M510 297 V420"/>
  <text class="edge" x="580" y="360">COMPENSATION_COMPLETED</text>
  <path class="line dash" d="M440 446 C300 446 300 150 305 128"/>
  <text class="edge" x="302" y="350">允许重试 pay.initiate</text>
  <path class="line" d="M715 297 C715 390 620 446 590 446"/>
  <text class="edge" x="720" y="374">终止性退款完成</text>
  <path class="line" d="M895 122 C895 350 680 446 590 446"/>
  <text class="edge" x="845" y="336">全额终止性退款完成</text>

  <text class="note" x="40" y="520">注：pay.refund 返回 processing 或 failed 时保持原支付事实状态；部分退款完成后也可保留 CONFIRMED、PARTIAL 或 COMPLETED。</text>
</svg>
