<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Resolve 原语状态机</title>
  <desc id="desc">争议从登记进入自治、调解或仲裁路径；处置结果形成后，仅在全部补偿动作完成时进入 COMPENSATED。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <style>
      .state { rx: 10; stroke-width: 2; }
      .normal { fill: #eef4ff; stroke: #4e73df; }
      .active { fill: #fff7df; stroke: #d69e2e; }
      .success { fill: #e8f7ed; stroke: #3a9d5d; }
      .failure { fill: #fdecec; stroke: #c94b4b; }
      .line { fill: none; stroke: #344054; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; text-anchor: middle; }
      .edge { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; text-anchor: middle; }
      .note { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
    </style>
  </defs>

  <rect class="state normal" x="50" y="55" width="130" height="52"/>
  <text class="label" x="115" y="86">INIT</text>
  <rect class="state active" x="245" y="55" width="140" height="52"/>
  <text class="label" x="315" y="86">RAISED</text>
  <rect class="state active" x="455" y="55" width="140" height="52"/>
  <text class="label" x="525" y="86">MEDIATING</text>
  <rect class="state active" x="665" y="55" width="140" height="52"/>
  <text class="label" x="735" y="86">ARBITRATING</text>
  <rect class="state active" x="455" y="235" width="140" height="52"/>
  <text class="label" x="525" y="266">ESCALATED</text>
  <rect class="state success" x="245" y="415" width="140" height="52"/>
  <text class="label" x="315" y="446">RESOLVED</text>
  <rect class="state success" x="455" y="555" width="150" height="52"/>
  <text class="label" x="530" y="586">COMPENSATED</text>
  <rect class="state failure" x="665" y="415" width="140" height="52"/>
  <text class="label" x="735" y="446">DISMISSED</text>

  <path class="line" d="M180 81 H245"/>
  <text class="edge" x="212" y="68">resolve.raise</text>
  <path class="line" d="M385 81 H455"/>
  <text class="edge" x="420" y="68">resolve.mediate</text>
  <path class="line" d="M385 92 C500 170 620 150 665 101"/>
  <text class="edge" x="545" y="151">允许直接进入 L3</text>
  <path class="line dash" d="M525 55 C525 20 610 20 610 81 C610 120 575 130 545 108"/>
  <text class="edge" x="610" y="29">补充调解材料</text>
  <path class="line" d="M455 107 C360 180 315 305 315 415"/>
  <text class="edge" x="340" y="252">mediation_resolved</text>
  <path class="line" d="M595 82 C650 130 700 260 720 415"/>
  <text class="edge" x="690" y="246">mediation_dismissed</text>
  <path class="line" d="M525 107 V235"/>
  <text class="edge" x="610" y="176">failed / timed out</text>
  <path class="line" d="M595 261 C640 250 690 180 720 108"/>
  <text class="edge" x="700" y="205">升级 L3</text>
  <path class="line" d="M455 261 C405 250 365 180 335 108"/>
  <text class="edge" x="385" y="205">升级 L2</text>
  <path class="line" d="M715 107 C610 230 455 360 385 425"/>
  <text class="edge" x="565" y="315">arbitration_resolved</text>
  <path class="line" d="M755 107 C780 210 770 325 740 415"/>
  <text class="edge" x="820" y="270">arbitration_dismissed</text>
  <path class="line" d="M315 467 C315 545 420 581 455 581"/>
  <text class="edge" x="352" y="538">全部子动作 completed</text>
  <path class="line dash" d="M245 441 C190 441 190 370 245 370 C300 370 300 400 285 414"/>
  <text class="edge" x="198" y="356">processing / failed：保持 RESOLVED</text>

  <text class="note" x="50" y="630">注：RESOLVED 表示已形成权威处置结果，不等于补偿已完成；只有 CompensationResult 与全部子动作均完成时才能进入 COMPENSATED。</text>
</svg>
