<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="400px" viewBox="-0.5 -0.5 760 400" font-family="Helvetica">
<defs>
<marker id="mInvArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">库存三层数量视图（粒度：listing_id + sku_id，可叠加 warehouse_id）</text>

<!-- available big box -->
<rect x="40" y="50" width="420" height="180" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="250" y="74" text-anchor="middle" font-size="13" font-weight="bold">available（可售总量 · 权威值）</text>
<text x="250" y="92" text-anchor="middle" font-size="10">Seller 唯一写入方：set（绝对值）/ adjust（增量）</text>

<!-- active_holds inside -->
<rect x="60" y="104" width="180" height="108" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="150" y="124" text-anchor="middle" font-size="11" font-weight="bold">active_holds（占用中）</text>
<text x="150" y="142" text-anchor="middle" font-size="9.5">hold：purchase.create 创建（带 TTL）</text>
<text x="150" y="157" text-anchor="middle" font-size="9.5">lock：purchase.complete 原子成立</text>
<text x="150" y="176" text-anchor="middle" font-size="9.5" fill="#b85450">写入方：协议引擎（P3）</text>
<text x="150" y="191" text-anchor="middle" font-size="9.5" fill="#b85450">Seller 只读（hold.query 核验）</text>

<!-- sellable inside -->
<rect x="260" y="104" width="180" height="108" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="350" y="124" text-anchor="middle" font-size="11" font-weight="bold">sellable（可下单量）</text>
<text x="350" y="144" text-anchor="middle" font-size="10">= available − Σ(active_holds)</text>
<text x="350" y="162" text-anchor="middle" font-size="9.5">派生只读值</text>
<text x="350" y="180" text-anchor="middle" font-size="9.5">== P1 Source 快照 stock</text>
<text x="350" y="195" text-anchor="middle" font-size="9.5">== purchase.create 校验读数（同源）</text>

<!-- consumed flow -->
<rect x="560" y="104" width="160" height="70" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="640" y="128" text-anchor="middle" font-size="11" font-weight="bold">consumed（已核销）</text>
<text x="640" y="146" text-anchor="middle" font-size="9.5">shipment.ship 确认后由 lock 转入</text>
<text x="640" y="161" text-anchor="middle" font-size="9.5">available 同步扣减 · revision 递增</text>

<path d="M 240 158 L 254 158" fill="none" stroke="rgb(0,0,0)" opacity="0"/>
<path d="M 460 139 L 556 139" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mInvArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="466" y="122" width="86" height="14" fill="#fff"/><text x="509" y="133">shipment.ship</text></g>

<!-- hold lifecycle band -->
<text x="380" y="266" text-anchor="middle" font-size="12" font-weight="bold">InventoryHold 生命周期（全部由交易事件驱动，MP2 操作不迁移状态）</text>
<rect x="60" y="284" width="110" height="40" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="115" y="309" text-anchor="middle" font-size="11" font-weight="bold">HELD</text>
<rect x="260" y="284" width="110" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="315" y="309" text-anchor="middle" font-size="11" font-weight="bold">LOCKED</text>
<rect x="460" y="284" width="120" height="40" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="520" y="309" text-anchor="middle" font-size="11" font-weight="bold">CONSUMED（终）</text>
<rect x="260" y="348" width="110" height="40" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="315" y="373" text-anchor="middle" font-size="11" font-weight="bold">RELEASED（终）</text>

<path d="M 170 304 L 256 304" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mInvArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="164" y="286" width="98" height="14" fill="#fff"/><text x="213" y="297">purchase.complete</text></g>
<path d="M 370 304 L 456 304" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mInvArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="372" y="286" width="84" height="14" fill="#fff"/><text x="414" y="297">shipment.ship</text></g>
<path d="M 115 324 L 115 368 L 256 368" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mInvArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="126" y="340" width="120" height="14" fill="#fff"/><text x="186" y="351">TTL 到期 / 草案取消</text></g>
<path d="M 315 324 L 315 344" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mInvArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="322" y="326" width="90" height="14" fill="#fff"/><text x="367" y="337">P3 补偿链释放</text></g>
<text x="640" y="372" text-anchor="middle" font-size="9.5" fill="#666">释放/创建均推送回调</text>
<text x="640" y="386" text-anchor="middle" font-size="9.5" fill="#666">（hold_created / hold_released）</text>
</g>
</svg>
