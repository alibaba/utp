<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="430px" viewBox="-0.5 -0.5 760 430" font-family="Helvetica">
<defs>
<marker id="mLoopArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mLoopArrowG" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#82b366"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">商品—交易闭环：供应商侧（UTP-M）与买方侧（P1—P6）的咬合</text>

<!-- Supplier band top -->
<rect x="20" y="40" width="720" height="92" rx="8" fill="none" stroke="#d79b00" stroke-dasharray="6 3"/>
<text x="78" y="58" font-size="11" fill="#d79b00" font-weight="bold">供应商侧（UTP-M）</text>

<rect x="40" y="68" width="150" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="115" y="88" text-anchor="middle" font-size="12" font-weight="bold">M2 入驻</text>
<text x="115" y="104" text-anchor="middle" font-size="10">Profile + 注册 + 资质</text>

<rect x="250" y="68" width="180" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="340" y="88" text-anchor="middle" font-size="12" font-weight="bold">MP1 publish → list</text>
<text x="340" y="104" text-anchor="middle" font-size="10">DRAFT→LISTED（可搜索）</text>

<rect x="490" y="68" width="180" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="580" y="88" text-anchor="middle" font-size="12" font-weight="bold">MP2 set / adjust</text>
<text x="580" y="104" text-anchor="middle" font-size="10">available 权威数量</text>

<!-- Buyer band middle -->
<rect x="20" y="168" width="720" height="92" rx="8" fill="none" stroke="#6c8ebf" stroke-dasharray="6 3"/>
<text x="82" y="186" font-size="11" fill="#6c8ebf" font-weight="bold">买方侧（UTP-B 规范）</text>

<rect x="40" y="196" width="150" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="115" y="216" text-anchor="middle" font-size="12" font-weight="bold">L0 发现（Ch.3）</text>
<text x="115" y="232" text-anchor="middle" font-size="10">Profile 验证 + 协商</text>

<rect x="250" y="196" width="180" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="340" y="216" text-anchor="middle" font-size="12" font-weight="bold">P1 search / P2 询盘</text>
<text x="340" y="232" text-anchor="middle" font-size="10">选品 · 报价（模式）</text>

<rect x="490" y="196" width="180" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="580" y="216" text-anchor="middle" font-size="12" font-weight="bold">P3 create / complete</text>
<text x="580" y="232" text-anchor="middle" font-size="10">校验库存 · hold · SIGNING</text>

<!-- Supplier band bottom -->
<rect x="20" y="296" width="720" height="92" rx="8" fill="none" stroke="#d79b00" stroke-dasharray="6 3"/>
<text x="78" y="314" font-size="11" fill="#d79b00" font-weight="bold">供应商侧（UTP-M）</text>

<rect x="40" y="324" width="180" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="130" y="344" text-anchor="middle" font-size="12" font-weight="bold">MP4 accept</text>
<text x="130" y="360" text-anchor="middle" font-size="10">卖方签名 → SIGNING→PURCHASED</text>

<rect x="280" y="324" width="180" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="370" y="344" text-anchor="middle" font-size="12" font-weight="bold">MP5 ship</text>
<text x="370" y="360" text-anchor="middle" font-size="10">→ P5 fulfill.notify(SHIPPED)</text>

<rect x="520" y="324" width="180" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="610" y="344" text-anchor="middle" font-size="12" font-weight="bold">M8 结算对账</text>
<text x="610" y="360" text-anchor="middle" font-size="10">← P4 支付确认 / receive</text>

<!-- vertical couplings -->
<path d="M 115 116 L 115 192" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>
<path d="M 340 116 L 340 192" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="346" y="146" width="118" height="14" fill="#fff"/><text x="405" y="157">LISTED 才可被搜索</text></g>
<path d="M 580 116 L 580 192" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="586" y="146" width="130" height="14" fill="#fff"/><text x="651" y="157">sellable 同源</text></g>

<path d="M 580 244 L 200 320" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="330" y="272" width="130" height="14" fill="#fff"/><text x="395" y="283">订单路由 order_routed</text></g>

<path d="M 220 348 L 276 348" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>
<path d="M 460 348 L 516 348" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mLoopArrow)"/>

<!-- loop back: settlement -> merchant top (dashed green) -->
<path d="M 700 348 L 730 348 L 730 92 L 674 92" fill="none" stroke="#82b366" stroke-dasharray="4 3" marker-end="url(#mLoopArrowG)"/>
<text x="738" y="220" text-anchor="middle" font-size="10" fill="#82b366" transform="rotate(90 738 220)">货款回流 · 闭环成立</text>

<!-- invariants note -->
<text x="380" y="412" text-anchor="middle" font-size="10" fill="#666">六条闭环不变式：能被搜到即可被订购 · 库存同源 · 签名同一 · 事实传导 · 结算可对账 · Mode 能力过滤</text>
</g>
</svg>
