<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="420px" viewBox="-0.5 -0.5 760 420" font-family="Helvetica">
<defs>
<marker id="mDlgArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mDlgArrowB" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6c8ebf"/></marker>
</defs>
<g>
<text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold">M1.4.4 Handler 执行模式：平台代答（direct）与透传（passthrough）</text>
<text x="380" y="42" text-anchor="middle" font-size="11" fill="#666">适用：P2 Negotiate 询盘 · P6 Resolve 争议（商家在 delegation_policy 中逐原语选择）</text>

<!-- Buyer -->
<rect x="30" y="80" width="130" height="50" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="95" y="102" text-anchor="middle" font-size="12" font-weight="bold">买方 Agent</text>
<text x="95" y="119" text-anchor="middle" font-size="10">negotiate.inquiry / resolve</text>

<!-- Marketplace -->
<rect x="300" y="80" width="160" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="380" y="102" text-anchor="middle" font-size="12" font-weight="bold">Marketplace</text>
<text x="380" y="119" text-anchor="middle" font-size="10">handler · 按 delegation_policy 分流</text>

<!-- request arrow -->
<path d="M 160 105 L 296 105" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mDlgArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="192" y="87" width="76" height="16" fill="#fff"/><text x="230" y="98">买方请求</text></g>

<!-- direct branch -->
<rect x="120" y="200" width="240" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="240" y="222" text-anchor="middle" font-size="12" font-weight="bold">direct（平台代答）</text>
<text x="240" y="240" text-anchor="middle" font-size="10">依据商家预声明数据与策略直接应答</text>
<text x="240" y="256" text-anchor="middle" font-size="10">如按 Listing pricing（阶梯价）自动报价</text>

<path d="M 350 130 L 260 196" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mDlgArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="256" y="152" width="88" height="16" fill="#fff"/><text x="300" y="163">mode=direct</text></g>

<!-- passthrough branch -->
<rect x="440" y="200" width="290" height="70" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="585" y="220" text-anchor="middle" font-size="12" font-weight="bold">passthrough（透传）</text>
<text x="585" y="238" text-anchor="middle" font-size="10">回调 inquiry_routed / dispute_routed → 商家/Agent</text>
<text x="585" y="254" text-anchor="middle" font-size="10">在 deadline 内回传结果（争议答辩 MUST 人工确认）</text>

<path d="M 420 130 L 540 196" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mDlgArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="428" y="152" width="120" height="16" fill="#fff"/><text x="488" y="163">mode=passthrough</text></g>

<!-- Seller box -->
<rect x="480" y="310" width="210 " height="50" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="585" y="332" text-anchor="middle" font-size="12" font-weight="bold">商家系统 / Merchant Agent</text>
<text x="585" y="349" text-anchor="middle" font-size="10">按报价策略生成 quote · 答辩草案（M10）</text>

<path d="M 560 270 L 560 306" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mDlgArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="462" y="280" width="92" height="14" fill="#fff"/><text x="508" y="291">回调（4.3.1 信封）</text></g>
<path d="M 610 306 L 610 270" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mDlgArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="616" y="280" width="92" height="14" fill="#fff"/><text x="662" y="291">deadline 内回传</text></g>

<!-- response back to buyer -->
<path d="M 120 235 L 60 235 L 60 134" fill="none" stroke="#6c8ebf" marker-end="url(#mDlgArrowB)"/>
<path d="M 440 244 L 400 244 L 400 290 L 90 290 L 90 134" fill="none" stroke="#6c8ebf" marker-end="url(#mDlgArrowB)"/>
<g font-size="10" text-anchor="middle" fill="#6c8ebf"><rect x="120" y="282" width="250" height="14" fill="#fff"/><text x="245" y="293">响应语义 / Schema / 错误码完全一致（买方不感知模式）</text></g>

<!-- timeout band -->
<rect x="30" y="380" width="700" height="28" rx="6" fill="none" stroke="#b85450" stroke-dasharray="4 3"/>
<text x="380" y="398" text-anchor="middle" font-size="11" fill="#b85450">passthrough 超时 → 按 on_timeout 兜底：direct_fallback（平台代答）或 structured_timeout（结构化超时）· MUST NOT 让买方请求悬挂</text>
</g>
</svg>
