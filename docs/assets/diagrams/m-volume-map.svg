<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="370px" viewBox="-0.5 -0.5 760 370" font-family="Helvetica">
<defs>
<marker id="mVolArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mVolArrowO" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#d79b00"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">商家侧分册（UTP-M）与主规范（买方侧）的章节对偶</text>

<!-- left column band -->
<rect x="30" y="40" width="300" height="290" rx="8" fill="none" stroke="#d79b00" stroke-dasharray="6 3"/>
<text x="180" y="60" text-anchor="middle" font-size="12" fill="#d79b00" font-weight="bold">供应商侧（UTP-M · 本分册）</text>

<!-- right column band -->
<rect x="430" y="40" width="300" height="290" rx="8" fill="none" stroke="#6c8ebf" stroke-dasharray="6 3"/>
<text x="580" y="60" text-anchor="middle" font-size="12" fill="#6c8ebf" font-weight="bold">采购侧（UTP 主规范）</text>

<!-- left items -->
<g>
<rect x="50" y="76" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="93" text-anchor="middle" font-size="11">M2 入驻与能力声明</text>
<rect x="50" y="112" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="129" text-anchor="middle" font-size="11">MP1 listing 发布 / 上架</text>
<rect x="50" y="148" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="165" text-anchor="middle" font-size="11">MP3 quote 询盘响应（草案，MAY）</text>
<rect x="50" y="184" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="201" text-anchor="middle" font-size="11">MP2 inventory 库存</text>
<rect x="50" y="220" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="237" text-anchor="middle" font-size="11">MP4 acceptance 接单 / 拒单</text>
<rect x="50" y="256" width="260" height="26" rx="4" fill="#ffe6cc" stroke="#d79b00"/><text x="180" y="273" text-anchor="middle" font-size="11">MP5 shipment 发货执行</text>
<rect x="50" y="292" width="260" height="26" rx="4" fill="#d5e8d4" stroke="#82b366"/><text x="180" y="309" text-anchor="middle" font-size="11">M8 结算与对账</text>
</g>

<!-- right items -->
<g>
<rect x="450" y="76" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="93" text-anchor="middle" font-size="11">L0 发现与协商（Ch.3）</text>
<rect x="450" y="112" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="129" text-anchor="middle" font-size="11">P1 Source 搜索 / 详情（Ch.11）</text>
<rect x="450" y="148" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="165" text-anchor="middle" font-size="11">P2 询盘原语（Ch.12）</text>
<rect x="450" y="184" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="201" text-anchor="middle" font-size="11">P3 Purchase 库存校验与锁定（Ch.13）</text>
<rect x="450" y="220" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="237" text-anchor="middle" font-size="11">P3 Purchase 订购成立（Ch.13）</text>
<rect x="450" y="256" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="273" text-anchor="middle" font-size="11">P5 Fulfill notify / query（Ch.15）</text>
<rect x="450" y="292" width="260" height="26" rx="4" fill="#dae8fc" stroke="#6c8ebf"/><text x="580" y="309" text-anchor="middle" font-size="11">P4 Pay 支付确认 → 打款（Ch.14）</text>
</g>

<!-- arrows: supply -> buy -->
<path d="M 310 89 L 446 89" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mVolArrow)"/>
<path d="M 310 125 L 446 125" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mVolArrow)"/>
<path d="M 310 155 L 446 155" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mVolArrow)"/>
<path d="M 446 167 L 314 167" fill="none" stroke="#d79b00" marker-end="url(#mVolArrowO)"/>
<path d="M 310 197 L 446 197" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mVolArrow)"/>
<path d="M 446 233 L 314 233" fill="none" stroke="#d79b00" marker-end="url(#mVolArrowO)"/>
<path d="M 310 269 L 446 269" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mVolArrow)"/>
<path d="M 446 305 L 314 305" fill="none" stroke="#d79b00" marker-end="url(#mVolArrowO)"/>

<text x="380" y="352" text-anchor="middle" font-size="10" fill="#666">黑色 = 供应商侧供给事实流向买方侧（报价 quote 亦为供给事实） · 橙色 = 买方侧事实回流供应商侧（询盘路由 / 订单路由 / 支付确认与打款）</text>
</g>
</svg>
