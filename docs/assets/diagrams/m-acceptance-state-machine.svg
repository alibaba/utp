<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="700px" height="520px" viewBox="0 0 700 520" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
<defs>
<marker id="mAccArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
</defs>

<!-- 标题 -->
<text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">受理任务状态机（资源作用域：routing_id · deadline 内收敛）</text>

<!-- 入口 -->
<text x="115" y="40" text-anchor="middle" font-size="11" fill="#666">订单路由（order_routed 回调）</text>
<path d="M 115 46 L 115 66" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#mAccArrow)"/>

<!-- 状态节点 -->
<g stroke-width="1.4">
<rect x="40" y="70" width="150" height="44" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="115" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">PENDING_ACCEPT</text>
<text x="115" y="105" text-anchor="middle" font-size="10" fill="#555">待受理（计时开始）</text>

<rect x="40" y="190" width="150" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="115" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ON_HOLD</text>
<text x="115" y="225" text-anchor="middle" font-size="10" fill="#555">内部审批挂起（时限不延长）</text>

<rect x="270" y="190" width="190" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="365" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">AMEND_PROPOSED</text>
<text x="365" y="225" text-anchor="middle" font-size="10" fill="#555">交期/价格变更待买方确认</text>

<rect x="40" y="330" width="160" height="44" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="120" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ACCEPTED（终态）</text>
<text x="120" y="365" text-anchor="middle" font-size="10" fill="#555">卖方签名 → SIGNING→PURCHASED</text>

<rect x="300" y="330" width="160" height="44" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="380" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">REJECTED（终态）</text>
<text x="380" y="365" text-anchor="middle" font-size="10" fill="#555">附原因码 → P3 补偿链</text>
</g>

<!-- 迁移线（正交走廊布线，无穿越、无交叉） -->
<g fill="none" stroke="#333" stroke-width="1.4">
<!-- PENDING_ACCEPT → ON_HOLD -->
<path d="M 115 114 L 115 186" marker-end="url(#mAccArrow)"/>
<!-- PENDING_ACCEPT → AMEND_PROPOSED -->
<path d="M 186 114 L 300 186" marker-end="url(#mAccArrow)"/>
<!-- PENDING_ACCEPT → ACCEPTED（左侧走廊 x=24） -->
<path d="M 40 96 L 24 96 L 24 352 L 36 352" marker-end="url(#mAccArrow)"/>
<!-- PENDING_ACCEPT → REJECTED（右侧内走廊 x=500） -->
<path d="M 190 100 L 500 100 L 500 340 L 464 340" marker-end="url(#mAccArrow)"/>
<!-- ON_HOLD → AMEND_PROPOSED -->
<path d="M 190 212 L 266 212" marker-end="url(#mAccArrow)"/>
<!-- ON_HOLD → ACCEPTED -->
<path d="M 70 234 L 70 326" marker-end="url(#mAccArrow)"/>
<!-- ON_HOLD → REJECTED（中层下方走廊 y=265） -->
<path d="M 160 234 L 160 265 L 330 265 L 330 326" marker-end="url(#mAccArrow)"/>
<!-- AMEND_PROPOSED → REJECTED -->
<path d="M 380 234 L 380 326" marker-end="url(#mAccArrow)"/>
<!-- AMEND_PROPOSED → ACCEPTED（右侧外走廊 x=530 + 底部走廊 y=400）；
     与 PA→REJECTED 走廊（x=500）在 (500,212) 相交，用跳线弧表示不相连 -->
<path d="M 460 212 L 494 212 A 6 6 0 0 0 506 212 L 530 212 L 530 400 L 120 400 L 120 378" marker-end="url(#mAccArrow)"/>
</g>

<!-- 迁移标签 -->
<g font-size="10" text-anchor="middle" fill="#222">
<rect x="122" y="142" width="34" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="139" y="152">hold</text>
<rect x="194" y="128" width="92" height="24" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="240" y="138">amend_leadtime</text><text x="240" y="149">/ amend_price</text>
<rect x="307" y="93" width="86" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="350" y="103">reject（附原因码）</text>
<text x="16" y="235" transform="rotate(-90 16 235)" font-size="9">accept（ES256 签 terms_hash）</text>
<rect x="202" y="205" width="52" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="228" y="215">amend</text>
<rect x="78" y="273" width="78" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="117" y="283">accept（ES256）</text>
<rect x="202" y="258" width="86" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="245" y="268">reject（附原因码）</text>
<rect x="386" y="273" width="58" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="415" y="283">买方拒绝</text>
<rect x="271" y="393" width="58" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="0.6"/><text x="300" y="403">买方确认</text>
</g>

<!-- deadline 兜底说明 -->
<rect x="30" y="420" width="640" height="74" rx="6" fill="#fff5f5" stroke="#b85450" stroke-dasharray="4 3"/>
<text x="350" y="442" text-anchor="middle" font-size="10" fill="#b85450">deadline 到期（任意非终态）→ 按 timeout_policy 收敛至 ACCEPTED（auto_accept）或</text>
<text x="350" y="460" text-anchor="middle" font-size="10" fill="#b85450">REJECTED（auto_reject），arrived_via = timeout_auto</text>
<text x="350" y="480" text-anchor="middle" font-size="10" fill="#b85450">终态后任何写操作 MUST 返回 ACCEPTANCE.STATE_CONFLICT（同 idempotency_key 幂等重放除外）· 订单永不悬挂</text>
</svg>
