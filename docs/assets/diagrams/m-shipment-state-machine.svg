<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="380px" viewBox="-0.5 -0.5 760 380" font-family="Helvetica">
<defs>
<marker id="mShpArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
</defs>
<g>
<text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold">Shipment 资源状态机（分批交付时每个 batch_id 独立实例化）</text>

<!-- entry -->
<text x="100" y="60" text-anchor="middle" font-size="11" fill="#666">（订购成立）</text>

<!-- PREPARING -->
<rect x="30" y="80" width="140" height="44" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="100" y="99" text-anchor="middle" font-size="12" font-weight="bold">PREPARING</text>
<text x="100" y="115" text-anchor="middle" font-size="10">备货中（不迁移买方状态）</text>

<!-- READY -->
<rect x="30" y="200" width="140" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="100" y="219" text-anchor="middle" font-size="12" font-weight="bold">READY</text>
<text x="100" y="235" text-anchor="middle" font-size="10">备货完成待交运</text>

<!-- SHIPPED -->
<rect x="300" y="140" width="160" height="44" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="380" y="159" text-anchor="middle" font-size="12" font-weight="bold">SHIPPED</text>
<text x="380" y="175" text-anchor="middle" font-size="10">→ 买方 fulfill.notify(SHIPPED)</text>

<!-- EXCEPTION -->
<rect x="300" y="280" width="160" height="44" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="380" y="299" text-anchor="middle" font-size="12" font-weight="bold">EXCEPTION</text>
<text x="380" y="315" text-anchor="middle" font-size="10">延迟/破损/丢件 → 买方 DELAYED</text>

<!-- DELIVERED -->
<rect x="560" y="140" width="170" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="645" y="159" text-anchor="middle" font-size="12" font-weight="bold">DELIVERED</text>
<text x="645" y="175" text-anchor="middle" font-size="10">妥投回执镜像（供应商只读）</text>

<!-- CLOSED -->
<rect x="560" y="280" width="170" height="44" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="645" y="299" text-anchor="middle" font-size="12" font-weight="bold">CLOSED（终态）</text>
<text x="645" y="315" text-anchor="middle" font-size="10">买方 receive / P6 裁决完毕</text>

<!-- entry -> PREPARING -->
<path d="M 100 64 L 100 76" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="108" y="62" width="120" height="16" fill="#fff"/><text x="168" y="73">prepare（可选申报）</text></g>

<!-- PREPARING -> READY -->
<path d="M 100 124 L 100 196" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="106" y="152" width="130" height="16" fill="#fff"/><text x="171" y="163">prepare(completed)</text></g>

<!-- PREPARING -> SHIPPED -->
<path d="M 170 102 L 340 136" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="216" y="100" width="36" height="16" fill="#fff"/><text x="234" y="111">ship</text></g>

<!-- READY -> SHIPPED -->
<path d="M 170 216 L 340 188" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="216" y="192" width="36" height="16" fill="#fff"/><text x="234" y="203">ship</text></g>

<!-- direct ship note -->
<text x="100" y="270" text-anchor="middle" font-size="10" fill="#666">跳过备货申报直接 ship 亦可（∅ → SHIPPED）</text>

<!-- SHIPPED <-> EXCEPTION -->
<path d="M 360 184 L 360 276" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="252" y="222" width="104" height="16" fill="#fff"/><text x="304" y="233">update(delay|exception)</text></g>
<path d="M 400 276 L 400 184" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="406" y="222" width="80" height="16" fill="#fff"/><text x="446" y="233">更正 / 重发</text></g>

<!-- SHIPPED -> DELIVERED -->
<path d="M 460 162 L 556 162" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="466" y="144" width="88" height="16" fill="#fff"/><text x="510" y="155">承运商妥投回执</text></g>

<!-- DELIVERED -> CLOSED -->
<path d="M 645 184 L 645 276" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mShpArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="652" y="222" width="96" height="16" fill="#fff"/><text x="700" y="233">receive / 裁决完毕</text></g>

<!-- constraint note -->
<rect x="30" y="332" width="440 " height="36" rx="6" fill="none" stroke="#b85450" stroke-dasharray="4 3"/>
<text x="250" y="347" text-anchor="middle" font-size="10" fill="#b85450">ship 对已 SHIPPED 批次 MUST 幂等返回既有凭证</text>
<text x="250" y="361" text-anchor="middle" font-size="10" fill="#b85450">DELIVERED/CLOSED 由回执与买方动作驱动，供应商 MUST NOT 直接声明（17.0.2）</text>
</g>
</svg>
