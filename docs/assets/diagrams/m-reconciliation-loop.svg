<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="360px" viewBox="-0.5 -0.5 760 360" font-family="Helvetica">
<defs>
<marker id="mRecArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mRecArrowR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">M7.5 对账闭环与差异处理（Reconciliation Loop）</text>

<!-- three-way check -->
<rect x="40" y="44" width="680" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="380" y="66" text-anchor="middle" font-size="12" font-weight="bold">三方核对</text>
<text x="380" y="86" text-anchor="middle" font-size="11">ERP 应收（本方账） × SettlementStatement（平台账） × PaymentConfirmation（协议事实）</text>

<!-- consistent branch -->
<rect x="40" y="150" width="300" height="56" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="190" y="172" text-anchor="middle" font-size="12" font-weight="bold">一致 → 确认账单</text>
<text x="190" y="192" text-anchor="middle" font-size="10">（或异议期满自动确认）→ 等待打款 → 核销 ERP 应收</text>

<path d="M 210 102 L 190 146" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mRecArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="150" y="116" width="40" height="16" fill="#fff"/><text x="170" y="127">一致</text></g>

<!-- discrepancy branch -->
<rect x="420" y="130" width="300" height="96" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="570" y="150" text-anchor="middle" font-size="12" font-weight="bold">discrepancy.submit（逐条目申报）</text>
<text x="570" y="168" text-anchor="middle" font-size="9.5">金额差异 fee_mismatch / gross_mismatch · 缺漏 entry_missing</text>
<text x="570" y="183" text-anchor="middle" font-size="9.5">状态差异 should_be_settleable / wrongly_frozen · adjustment_dispute</text>
<text x="570" y="203" text-anchor="middle" font-size="9.5" fill="#b85450">MUST 引用 entry_id + 证据引用（ERP 单据 / 收货凭证）</text>

<path d="M 550 102 L 570 126" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mRecArrow)"/>
<g font-size="11" text-anchor="middle"><rect x="560" y="108" width="52" height="16" fill="#fff"/><text x="586" y="119">不一致</text></g>

<!-- marketplace reply -->
<rect x="420" y="256" width="300" height="52" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="570" y="276" text-anchor="middle" font-size="11" font-weight="bold">Marketplace MUST 在 SLA 内答复</text>
<text x="570" y="294" text-anchor="middle" font-size="9.5">更正账单（生成新版本，旧版本保留）或 维持并说明</text>

<path d="M 570 226 L 570 252" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mRecArrow)"/>

<!-- corrections loop back -->
<path d="M 420 282 L 190 282 L 190 210" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mRecArrow)"/>
<g font-size="10" text-anchor="middle"><rect x="216" y="266" width="150" height="14" fill="#fff"/><text x="291" y="277">更正账单 → 重新核对确认</text></g>

<!-- escalation -->
<rect x="40" y="256" width="220 " height="52" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="150" y="278" text-anchor="middle" font-size="11" font-weight="bold">升级 P6 Resolve</text>
<text x="150" y="296" text-anchor="middle" font-size="9.5">Arbiter 裁决 → 调整项进入后续账单</text>
<path d="M 570 308 L 570 330 L 150 330 L 150 312" fill="none" stroke="#b85450" marker-end="url(#mRecArrowR)"/>
<g font-size="10" text-anchor="middle" fill="#b85450"><rect x="300" y="322" width="130" height="14" fill="#fff"/><text x="365" y="333">维持答复后仍有异议</text></g>

<text x="380" y="352" text-anchor="middle" font-size="10" fill="#666">全部过程纳入审计记录 · 账单版本化（不可覆盖）· 差异申报不改变支付状态（资金后果 MUST 经 P4 refund 或 P6 产生）</text>
</g>
</svg>
