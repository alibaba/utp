<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="290px" viewBox="-0.5 -0.5 760 290" font-family="Helvetica">
<defs>
<marker id="mMlcArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(0,0,0)"/></marker>
<marker id="mMlcArrowR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/></marker>
</defs>
<g>
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold">M2.7 商户生命周期（Merchant Lifecycle）</text>

<!-- PENDING_QUALIFICATION -->
<rect x="30" y="60" width="190" height="48" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="125" y="80" text-anchor="middle" font-size="11" font-weight="bold">PENDING_QUALIFICATION</text>
<text x="125" y="97" text-anchor="middle" font-size="9.5">注册受理 · 资质审核中</text>

<!-- SANDBOX -->
<rect x="290" y="60" width="160" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="370" y="80" text-anchor="middle" font-size="11" font-weight="bold">SANDBOX</text>
<text x="370" y="97" text-anchor="middle" font-size="9.5">沙箱验收中（7 项，M2.6.2）</text>

<!-- ACTIVE -->
<rect x="520" y="60" width="160" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="600" y="80" text-anchor="middle" font-size="11" font-weight="bold">ACTIVE</text>
<text x="600" y="97" text-anchor="middle" font-size="9.5">正式营业 · 全部 MP 生产操作</text>

<path d="M 220 84 L 286 84" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="216" y="66" width="74" height="14" fill="#fff"/><text x="253" y="77">QUALIFIED</text></g>
<path d="M 450 84 L 516 84" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="446" y="66" width="74" height="14" fill="#fff"/><text x="483" y="77">验收全过</text></g>

<!-- RESTRICTED -->
<rect x="290" y="170" width="200" height="52" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
<text x="390" y="190" text-anchor="middle" font-size="11" font-weight="bold">RESTRICTED</text>
<text x="390" y="205" text-anchor="middle" font-size="9.5">仅 query + 既有订单 MP4/MP5 履行</text>
<text x="390" y="217" text-anchor="middle" font-size="9.5" fill="#b85450">MUST NOT publish / list</text>

<!-- TERMINATED -->
<rect x="560" y="170" width="160" height="52" rx="6" fill="#f5f5f5" stroke="#666666"/>
<text x="640" y="190" text-anchor="middle" font-size="11" font-weight="bold">TERMINATED（终态）</text>
<text x="640" y="205" text-anchor="middle" font-size="9.5">只读 · 存量订单 MUST 履行完毕</text>
<text x="640" y="217" text-anchor="middle" font-size="9.5">或经 P6 Resolve 处置</text>

<path d="M 560 108 L 430 166" fill="none" stroke="#b85450" marker-end="url(#mMlcArrowR)"/>
<g font-size="9.5" text-anchor="middle" fill="#b85450"><rect x="426" y="126" width="148" height="14" fill="#fff"/><text x="500" y="137">违规 / 资质过期 / 风控触发</text></g>
<path d="M 490 190 L 542 152 L 566 122" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)" opacity="0"/>
<path d="M 470 170 L 560 116" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="488" y="150" width="60" height="14" fill="#fff"/><text x="518" y="161">整改恢复</text></g>
<path d="M 490 196 L 556 196" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="492" y="178" width="60" height="14" fill="#fff"/><text x="522" y="189">治理裁决</text></g>
<path d="M 640 108 L 640 166" fill="none" stroke="rgb(0,0,0)" marker-end="url(#mMlcArrow)"/>
<g font-size="9.5" text-anchor="middle"><rect x="648" y="130" width="90" height="14" fill="#fff"/><text x="693" y="141">供应商申请退出</text></g>

<!-- notes -->
<rect x="30" y="244" width="700" height="36" rx="6" fill="none" stroke="#b85450" stroke-dasharray="4 3"/>
<text x="380" y="259" text-anchor="middle" font-size="10" fill="#b85450">状态变更 MUST 回调通知并附结构化原因码与申诉路径 · RESTRICTED/TERMINATED MUST NOT 影响已成立订单的履约义务（义务连续性原则）</text>
<text x="380" y="274" text-anchor="middle" font-size="10" fill="#b85450">凭证吊销与失效是 RESTRICTED/TERMINATED 的技术执行手段（M2.4.3）</text>
</g>
</svg>
